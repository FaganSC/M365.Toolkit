name: Production Build, Release, and Publish Module

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - docs/**
      - .github/workflows/pages.yml
  pull_request:
    branches:
      - main
    paths-ignore:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize main release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $manifest = Import-PowerShellDataFile -Path ./M365.Toolkit.psd1
          $prerelease = [string]$manifest.PrivateData.PSData.Prerelease
          if ([string]::IsNullOrWhiteSpace($prerelease)) {
            Write-Host 'The manifest already contains a stable version.'
            exit 0
          }

          $newVersion = ./build/Update-ModuleVersion.ps1 `
            -ManifestPath ./M365.Toolkit.psd1 `
            -Bump Minor `
            -ClearPrerelease

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add M365.Toolkit.psd1
          git commit -m "chore: set module version to v$newVersion [skip ci]"
          git push origin HEAD:main

      - name: Read module version from manifest
        id: version
        shell: pwsh
        run: |
          $manifest = Import-PowerShellDataFile -Path ./M365.Toolkit.psd1
          $moduleVersionText = [string]$manifest.ModuleVersion
          if ([string]::IsNullOrWhiteSpace($moduleVersionText)) {
            throw 'ModuleVersion was not found in M365.Toolkit.psd1.'
          }
          if ('${{ github.event_name }}' -ne 'pull_request' -and
            -not [string]::IsNullOrWhiteSpace([string]$manifest.PrivateData.PSData.Prerelease)) {
            throw 'Production releases cannot contain a prerelease label.'
          }

          $moduleVersion = [version]$moduleVersionText
          $releaseTag = "v$moduleVersion"
          $publishRelease = '${{ github.event_name }}' -ne 'pull_request'

          if ('${{ github.ref_type }}' -eq 'tag') {
            $tagName = '${{ github.ref_name }}'
            if ($tagName -notmatch '^v\d+\.0\.0$') {
              throw "Major release tags must use the format v<major>.0.0. Received: $tagName"
            }
            if ($tagName -ne $releaseTag) {
              throw "Tag $tagName does not match manifest version $moduleVersion."
            }
          }
          elseif ('${{ github.event_name }}' -ne 'pull_request') {
            $releasedMajors = @(
              git tag --list |
                ForEach-Object {
                  $tagVersion = $null
                  if (
                    $_ -match '^v?(\d+\.\d+\.\d+(?:\.\d+)?)$' -and
                    [version]::TryParse($Matches[1], [ref]$tagVersion)
                  ) {
                    $tagVersion.Major
                  }
                } |
                Sort-Object -Unique
            )

            if ($releasedMajors.Count -gt 0 -and $moduleVersion.Major -notin $releasedMajors) {
              Write-Host "Skipping publish. Major version $($moduleVersion.Major) requires tag v$($moduleVersion.Major).0.0."
              $publishRelease = $false
            }
          }

          "module_version=$moduleVersionText" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publish_release=$($publishRelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install test dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Install-Module -Name PnP.PowerShell -RequiredVersion 3.1.0 -Force -Scope CurrentUser -AllowClobber

      - name: Validate module manifest
        shell: pwsh
        run: |
          Test-ModuleManifest -Path ./M365.Toolkit.psd1 | Out-Null

      - name: Run Pester tests
        shell: pwsh
        run: |
          Invoke-Pester -Path ./src/tests/M365.Toolkit.Tests.ps1 -CI

      - name: Sign module scripts
        if: steps.version.outputs.publish_release == 'true'
        shell: pwsh
        env:
          CODESIGNINGPFXBASE64: ${{ secrets.CODESIGNINGPFXBASE64 }}
          CODESIGNINGPFXPASSWORD: ${{ secrets.CODESIGNINGPFXPASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODESIGNINGPFXBASE64)) {
            throw 'Secret CODESIGNINGPFXBASE64 is missing.'
          }
          if ([string]::IsNullOrWhiteSpace($env:CODESIGNINGPFXPASSWORD)) {
            throw 'Secret CODESIGNINGPFXPASSWORD is missing.'
          }

          ./build/Sign-Module.ps1 `
            -ModulePath . `
            -PfxBase64 $env:CODESIGNINGPFXBASE64 `
            -PfxPassword $env:CODESIGNINGPFXPASSWORD

      - name: Create or update GitHub release
        if: steps.version.outputs.publish_release == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.release_tag }}
          name: Release ${{ steps.version.outputs.release_tag }}
          body: |
            Automated release for M365.Toolkit version ${{ steps.version.outputs.module_version }}.
          allowUpdates: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Strip authenticode signatures before publish
        if: steps.version.outputs.publish_release == 'true'
        shell: pwsh
        run: |
          # PSGallery does not require signed files. Publishing files signed with a
          # self-signed certificate causes Install-Module to fail on end-user machines
          # because the certificate is not in their trusted roots. Strip signature
          # blocks here so the gallery copy is unsigned.
          $extensions = '*.ps1', '*.psm1', '*.psd1', '*.ps1xml', '*.cdxml'
          $files = Get-ChildItem -Path . -Recurse -Include $extensions
          foreach ($file in $files) {
              $content = Get-Content -Path $file.FullName -Raw
              if ($content -match '# SIG # Begin signature block') {
                  $stripped = $content -replace '(?s)\r?\n# SIG # Begin signature block.+', ''
                  Set-Content -Path $file.FullName -Value $stripped -NoNewline -Encoding UTF8
                  Write-Host "Stripped signature from $($file.FullName)"
              }
          }

      - name: Publish module to PowerShell Gallery
        if: steps.version.outputs.publish_release == 'true'
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERYAPIKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
            throw 'Secret PSGALLERYAPIKEY is missing. Add it in repository secrets.'
          }

          $manifestPath = './M365.Toolkit.psd1'
          $manifest = Import-PowerShellDataFile -Path $manifestPath
          $moduleName = (Split-Path -Path $manifestPath -LeafBase)
          $moduleVersion = [version]$manifest.ModuleVersion

          $galleryModule = Find-Module -Name $moduleName -Repository PSGallery -ErrorAction SilentlyContinue
          if ($null -ne $galleryModule -and [version]$galleryModule.Version -ge $moduleVersion) {
            Write-Host "Skipping publish. $moduleName version $($galleryModule.Version) already exists in PSGallery."
            exit 0
          }

          Publish-Module -Path . -NuGetApiKey $env:PSGALLERY_API_KEY -Force -ErrorAction Stop
