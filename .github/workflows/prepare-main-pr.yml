name: Prepare Main Pull Request Version

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: main-pr-version-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  update-version:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install module dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PnP.PowerShell -RequiredVersion 3.1.0 -Force -Scope CurrentUser -AllowClobber

      - name: Set stable pull request version
        id: version
        shell: pwsh
        run: |
          $newVersion = ./build/Update-ModuleVersion.ps1 `
            -ManifestPath ./M365.Toolkit.psd1 `
            -Bump Minor `
            -ClearPrerelease

          'changed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "new_version=$newVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Commit stable version
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add M365.Toolkit.psd1

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'The manifest already has the requested version.'
            exit 0
          }

          git commit -m "chore: set module version to v$env:NEW_VERSION"
          git push origin "HEAD:$env:HEAD_REF"
